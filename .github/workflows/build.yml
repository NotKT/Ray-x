name: Build Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Add Gradle Wrapper
        run: |
          wget https://services.gradle.org/distributions/gradle-8.14-bin.zip -q
          unzip -q gradle-8.14-bin.zip
          BUILD_DIR=$(find . -name "settings.gradle" | grep -v ".gradle/" | head -1 | xargs dirname)
          echo "Building in: $BUILD_DIR"
          cd $BUILD_DIR
          /home/runner/work/Ray-x/Ray-x/gradle-8.14/bin/gradle wrapper
      - name: Build
        run: |
          BUILD_DIR=$(find . -name "settings.gradle" | grep -v ".gradle/" | head -1 | xargs dirname)
          cd $BUILD_DIR
          ./gradlew build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: xray-mod
          path: "**/build/libs/*[^s].jar"
